name: Publish site

# GitHub Pages serves the gh-pages branch, so this keeps it identical to main.
# Without it, list edits would never reach the page.
on:
  push:
    branches: [main]
  # Bot commits don't start other workflows, so the data job needs its own trigger.
  workflow_run:
    workflows: ["Update list data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bring gh-pages up to main
        run: git push origin HEAD:refs/heads/gh-pages
