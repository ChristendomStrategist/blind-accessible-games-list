name: Announce list updates

# Posts new, updated and removed entries to Discord, pinging @everyone, after
# each push to main that changes README.md. It posts to the repository secrets
# DISCORD_WEBHOOK_URL, then DISCORD_WEBHOOK_URL2, and so on. Without any (on
# forks, say) the run only prints what it would have sent.
#
# Each secret is named below on purpose. Handing the script every secret at
# once (toJSON(secrets)) got the run held as "may be malicious" on 2026-11-25.
# For another server, add a secret DISCORD_WEBHOOK_URL3 and a line for it.
on:
  push:
    branches: [main]
    paths: [README.md]

permissions:
  contents: read

# One announcement at a time, in push order.
concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Announce
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL2: ${{ secrets.DISCORD_WEBHOOK_URL2 }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python tools/announce_update.py --before "$BEFORE" --after "$AFTER"
